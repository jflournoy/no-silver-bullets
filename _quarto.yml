project:
  type: manuscript
  output-dir: docs

manuscript:
  meca-bundle: false

execute:
  freeze: auto
  daemon: false

format:
  html:
    toc: true
    include-in-header:
      - text: |
          <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
  docx: default
  arxiv-pdf:
    keep-tex: true
    authorcols: true
    runninghead: 'No Silver Bullets for Cycle Time'
    pdf-engine: xelatex
    pdf-engine-opt: "-output-directory=."
    include-in-header:
      text: |
        \usepackage{fbb}
        \usepackage{afterpage}
        \usepackage{dblfloatfix}
        \usepackage{newunicodechar}
        \newunicodechar{λ}{\ensuremath{\lambda}}
        \providecommand{\ascline}[3]{\noalign{\global\arrayrulewidth #1}\arrayrulecolor[HTML]{#2}\cmidrule(l){#3}}
        \newcommand{\xfnm}[1][]{\ifx!#1!\else\unskip,\space#1\fi}
